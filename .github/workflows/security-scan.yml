name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check links
        run: python3 scripts/check-links.py

      - name: Scan for secrets
        run: |
          set -e
          # 简单的 grep-based 密钥扫描，覆盖常见云服务 / API 密钥模式
          # 排除 .git、node_modules 与本工作流文件自身（其中记录了这些模式）
          if grep -rnE "(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|xox[baprs]-[a-zA-Z0-9-]{10,}|ghp_[a-zA-Z0-9]{36}|API_KEY=[\"']?[a-zA-Z0-9]{8,})" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude="security-scan.yml" . ; then
            echo "::error::Potential secret detected in repository"
            exit 1
          fi
          echo "No secrets detected"
