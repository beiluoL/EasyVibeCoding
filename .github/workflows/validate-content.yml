name: Validate Content

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skills
        run: python3 scripts/validate-skill.py

      - name: Validate cases
        run: python3 scripts/validate-case.py

      - name: Validate prompts
        run: python3 scripts/validate-prompt.py

      - name: Validate registry
        run: python3 scripts/validate-registry.py
